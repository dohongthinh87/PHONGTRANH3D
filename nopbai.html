<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Nộp Bài Triển Lãm 3D</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; box-sizing: border-box; }
    h2 { color: #1a73e8; text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 14px; }
    input[type="text"], select, input[type="file"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    textarea { resize: vertical; height: 80px; }
    .submit-btn { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.2s; }
    .submit-btn:hover { background: #218838; }
    .note { font-size: 12px; color: #666; text-align: center; margin-top: 15px; line-height: 1.5; }
  </style>
</head>
<body>

  <div class="container">
    <h2>🎨 Cổng Nộp Bài Học Sinh</h2>
    <form id="submit-form" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label>Họ và tên học sinh:</label>
        <input type="text" id="student-name" required placeholder="Ví dụ: Nguyễn Văn A">
      </div>

      <div class="form-group">
        <label>Chọn số thứ tự tranh muốn treo (Từ 1 đến 45):</label>
        <select id="artwork-slot" required>
          <option value="">-- Chọn ô số thứ tự --</option>
          <script>
            for(let i=1; i<=45; i++) {
              document.write(`<option value="${i}">Tác phẩm số ${i}</option>`);
            }
          </script>
        </select>
      </div>

      <div class="form-group">
        <label>Tiêu đề tác phẩm:</label>
        <input type="text" id="artwork-title" required placeholder="Tên tác phẩm của bạn">
      </div>

      <div class="form-group">
        <label>Mô tả ngắn / Ý nghĩa sản phẩm:</label>
        <textarea id="artwork-desc" placeholder="Giới thiệu đôi nét về sản phẩm..."></textarea>
      </div>

      <div class="form-group">
        <label>Tải lên hình ảnh bài làm (JPG/PNG):</label>
        <input type="file" id="artwork-file" accept="image/*" required>
      </div>

      <button type="submit" class="submit-btn" id="btn-submit">🚀 Gửi bài lên hệ thống</button>
    </form>
    <div class="note">Sau khi gửi, giáo viên sẽ kiểm duyệt và đưa vào phòng tranh 3D chính thức.</div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://nnamdbcctgakutjuxrmt.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_mvUzfankFVz9zbhGWuPMxw_GZketbmc';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: false, autoRefreshToken: false }
    });

    window.handleSubmit = async function(event) {
      event.preventDefault();
      
      const btn = document.getElementById('btn-submit');
      btn.innerText = "Đang xử lý gửi bài...";
      btn.disabled = true;

      const name = document.getElementById('student-name').value;
      const slot = parseInt(document.getElementById('artwork-slot').value);
      const title = document.getElementById('artwork-title').value;
      const desc = document.getElementById('artwork-desc').value;
      const fileInput = document.getElementById('artwork-file');
      const file = fileInput.files[0];

      if (!file) {
        alert("Vui lòng chọn file ảnh!");
        btn.innerText = "🚀 Gửi bài lên hệ thống";
        btn.disabled = false;
        return;
      }

      try {
        // 1. Tải ảnh lên Storage
        const fileExt = file.name.split('.').pop();
        const fileName = `artwork_${slot}_${Date.now()}.${fileExt}`;
        
        const { data: uploadData, error: uploadError } = await supabase.storage
          .from('uploads')
          .upload(fileName, file, { cacheControl: '3600', upsert: true });

        if (uploadError) {
          throw new Error("Lỗi tải ảnh lên Storage: " + uploadError.message);
        }

        // 2. Lấy đường dẫn công khai của ảnh
        const { data: publicUrlData } = supabase.storage
          .from('uploads')
          .getPublicUrl(fileName);

        const imageUrl = publicUrlData.publicUrl;

        // 3. Lưu thông tin vào bảng artworks
        const { error: dbError } = await supabase
          .from('artworks')
          .upsert([
            { 
              id: slot, 
              title: title, 
              author: name, 
              description: desc, 
              image_url: imageUrl, 
              status: 'approved' 
            }
          ], { onConflict: ['id'] });

        if (dbError) {
          throw new Error("Lỗi lưu cơ sở dữ liệu: " + dbError.message);
        }

        alert(`🎉 Thành công! Em ${name} đã gửi bài thành công cho Ô số ${slot}.`);
        document.getElementById('submit-form').reset();
      } catch (error) {
        console.error("Chi tiết lỗi:", error);
        alert("Có lỗi xảy ra: " + error.message);
      } finally {
        btn.innerText = "🚀 Gửi bài lên hệ thống";
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
